---
- hosts: k8s-master
  become: true
  become_user: root
  tasks:
    - import_role:
        name: k8s
        tasks_from: generate_join_cluster_command

- hosts: k8s-node
  become: true
  become_user: root
  tasks:
    - import_role:
        name: k8s
        tasks_from: common
    
    - import_role:
        name: k8s
        tasks_from: setup_bluetooth

    - import_role:
        name: k8s
        tasks_from: join_cluster

- hosts: k8s-master
  become: true
  become_user: root
  tasks:
    - name: Validate installed Kubernetes cluster
      import_role:
        name: k8s_common
        tasks_from: healthcheck
