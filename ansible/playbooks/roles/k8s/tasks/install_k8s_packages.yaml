---
- name: Configure Kubernetes package repository
  ansible.builtin.include_role:
    name: k8s_common
    tasks_from: repository
  vars:
    k8s_package_version: "{{ k8s_bootstrap_version }}"

- name: Install kubeadm, kubelet, and kubectl
  ansible.builtin.include_role:
    name: k8s_common
    tasks_from: packages
  vars:
    k8s_package_version: "{{ k8s_bootstrap_version }}"
    k8s_package_names:
      - kubeadm
      - kubelet
      - kubectl
